services:
  web-build:
    image: denoland/deno:2.6.3
    working_dir: /app
    environment:
      DENO_DIR: /deno-dir
    volumes:
      - ./deno.json:/app/deno.json:ro
      - ./web:/app/web
      - deno_cache:/deno-dir
    command:
      - /bin/sh
      - -c
      - |
        set -e
        deno task web:install
        deno task web:build
        chown -R ${UID}:${GID} /app/web/node_modules
        chown -R ${UID}:${GID} /app/web/dist
    restart: no

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@postgres:${DB_PORT}/${DB_NAME}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  locust:
    image: locustio/locust
    volumes:
      - ./locust:/mnt/locust:ro
    working_dir: /mnt/locust
    restart: no
    ports:
      - "8089:8089"
    command: >
      -f locustfile.py --host http://app-locust:${APP_PORT} --processes 4

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    depends_on:
      - app
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    restart: unless-stopped

volumes:
  deno_cache:
  postgres_data:
  prometheus_data:
  grafana_data:
